<svg fill="#f5f5f5" xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="'Pretendard', system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 330" role="img" aria-label="workspace의 생성과 검사 순서: 수정 전과 후" font-size="13">
<rect x="0" y="0" width="760" height="330" fill="#2d3142"/><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3acbf"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6a95d8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f08a59"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-size="15" font-weight="600" xml:space="preserve" fill="#f5f5f5">workspace의 생성과 검사 순서: 수정 전과 후</text>
<text x="24" y="64" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#f5f5f5">수정 전 (v0.27.1): 생성이 먼저</text>
<rect x="24" y="76" width="130" height="52" rx="8" fill="none" fill-opacity="1.0" stroke="#5a6180" stroke-width="1.25"/><text x="89.0" y="98.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">backend 결정</text><text x="89.0" y="114.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">auto → mnnvl</text>
<rect x="184" y="76" width="180" height="52" rx="8" fill="#f08a59" fill-opacity="0.16" stroke="#f08a59" stroke-width="1.25"/><text x="274.0" y="98.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">workspace 생성</text><text x="274.0" y="114.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">30초 멈춘 뒤 예외</text>
<rect x="394" y="76" width="180" height="52" rx="8" fill="none" fill-opacity="1.0" stroke="#5a6180" stroke-width="1.25" stroke-dasharray="5 4"/><text x="484.0" y="98.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#a3acbf">검사: multicast 주소</text><text x="484.0" y="114.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#a3acbf">도달하지 못함</text>
<rect x="604" y="76" width="132" height="52" rx="8" fill="#f08a59" fill-opacity="0.16" stroke="#f08a59" stroke-width="1.25"/><text x="670.0" y="98.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">None</text><text x="670.0" y="114.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">GPU memory 잔류</text>
<path d="M154 102.0H182" fill="none" stroke="#a3acbf" stroke-width="1.4" marker-end="url(#a-muted)"/>
<path d="M364 102.0H392" fill="none" stroke="#a3acbf" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a-muted)"/>
<path d="M574 102.0H602" fill="none" stroke="#a3acbf" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a-muted)"/>
<text x="184" y="148" text-anchor="start" font-size="12" xml:space="preserve" fill="#a3acbf">생성이 실패해야 쓸 수 없다는 것을 안다.</text>
<text x="24" y="190" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#f5f5f5">수정 후 (#53377): 검사가 먼저</text>
<rect x="24" y="202" width="130" height="52" rx="8" fill="none" fill-opacity="1.0" stroke="#5a6180" stroke-width="1.25"/><text x="89.0" y="224.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">backend 결정</text><text x="89.0" y="240.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">auto → mnnvl</text>
<rect x="184" y="202" width="180" height="52" rx="8" fill="#6a95d8" fill-opacity="0.16" stroke="#6a95d8" stroke-width="1.25"/><text x="274.0" y="224.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">검사: NVLink fabric</text><text x="274.0" y="240.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">rank 16개 모두 False</text>
<rect x="394" y="202" width="180" height="52" rx="8" fill="none" fill-opacity="1.0" stroke="#5a6180" stroke-width="1.25" stroke-dasharray="5 4"/><text x="484.0" y="224.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#a3acbf">workspace 생성</text><text x="484.0" y="240.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#a3acbf">실행하지 않음</text>
<rect x="604" y="202" width="132" height="52" rx="8" fill="none" fill-opacity="1.0" stroke="#5a6180" stroke-width="1.25"/><text x="670.0" y="224.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">None</text><text x="670.0" y="240.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">멈춤과 잔류 없음</text>
<path d="M154 228.0H182" fill="none" stroke="#a3acbf" stroke-width="1.4" marker-end="url(#a-muted)"/>
<path d="M364 228.0H392" fill="none" stroke="#a3acbf" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a-muted)"/>
<path d="M574 228.0H602" fill="none" stroke="#a3acbf" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a-muted)"/>
<text x="184" y="274" text-anchor="start" font-size="12" xml:space="preserve" fill="#a3acbf">모든 rank가 답을 모으고, 하나라도 False면 생성하지 않는다.</text>
<text x="24" y="310" text-anchor="start" font-size="12" xml:space="preserve" fill="#a3acbf">두 경우 모두 None을 받은 호출자는 일반 all-reduce와 RMSNorm으로 돌아간다.</text>
</svg>
