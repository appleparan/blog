<path d="M99 166V196" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#a-blue)"/>
<text x="108" y="186" text-anchor="start" font-size="12" xml:space="preserve" fill="#2e5aa8">전달됨</text>
<path d="M141 149H249" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a-orange)"/>
<text x="196" y="141" text-anchor="middle" font-size="12" font-weight="600" xml:space="preserve" fill="#eb6c36">연결 불가</text>
<text x="24" y="270" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">다른 host의 fd.sock 경로는 열 수 없다.</text>
<text x="24" y="288" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">30초 재시도 뒤 timeout.</text>
<text x="392" y="66" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#2d3142">FABRIC handle</text><text x="392" y="84" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">byte 열이라 allgather로 전달</text><rect x="392" y="98" width="150" height="150" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="404" y="118" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">node 0</text><rect x="586" y="98" width="150" height="150" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="598" y="118" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">node 1</text>
<rect x="425" y="132" width="84" height="34" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="467.0" y="153.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">rank 0</text>
<rect x="425" y="198" width="84" height="34" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="467.0" y="219.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">rank 1</text>
<rect x="619" y="132" width="84" height="34" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="661.0" y="153.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">rank 8</text>
<path d="M467 166V196" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#a-blue)"/>
<path d="M509 149H617" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#a-blue)"/>
<text x="564" y="141" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2e5aa8">전달됨</text>
<text x="392" y="270" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">조건: 모든 rank가 같은 NVLink fabric에</text>
<text x="392" y="288" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">속해야 한다 (같은 clusterUuid).</text>
</svg>
