<svg fill="#2d3142" xmlns="http://www.w3.org/2000/svg" width="760" height="308" font-family="'Pretendard', system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 308" role="img" aria-label="GPU memory handle의 두 전달 방식" font-size="13">
<rect x="0" y="0" width="760" height="308" fill="#efede7"/><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66708a"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e5aa8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6c36"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-size="15" font-weight="600" xml:space="preserve" fill="#2d3142">GPU memory handle의 두 전달 방식</text>
<text x="24" y="66" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#2d3142">POSIX fd</text><text x="24" y="84" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">Unix socket의 SCM_RIGHTS로 전달</text><rect x="24" y="98" width="150" height="150" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="36" y="118" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">node 0</text><rect x="218" y="98" width="150" height="150" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="230" y="118" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">node 1</text>
