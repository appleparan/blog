<rect x="57" y="198" width="84" height="34" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="99.0" y="219.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">rank 1</text>
