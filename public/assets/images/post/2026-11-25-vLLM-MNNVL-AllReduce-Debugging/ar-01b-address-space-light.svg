<svg fill="#2d3142" xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="'Pretendard', system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 330" role="img" aria-label="다른 GPU의 memory에 닿는 두 방식: NVLink의 매핑과 InfiniBand의 복사" font-size="13">
<rect x="0" y="0" width="760" height="330" fill="#efede7"/><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66708a"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e5aa8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6c36"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-size="15" font-weight="600" xml:space="preserve" fill="#2d3142">다른 GPU의 memory에 닿는 두 방식: NVLink의 매핑과 InfiniBand의 복사</text>
<text x="24" y="60" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#2d3142">NVLink domain</text>
<rect x="24" y="74" width="340" height="92" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="36" y="95" text-anchor="start" font-size="12" font-weight="600" xml:space="preserve" fill="#2d3142">rank 0의 process: 가상 주소 공간</text>
<rect x="40" y="108" width="150" height="40" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="115.0" y="132.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">내 buffer</text>
<rect x="198" y="108" width="150" height="40" rx="8" fill="#2e5aa8" fill-opacity="0.16" stroke="#2e5aa8" stroke-width="1.25"/><text x="273.0" y="124.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">rank 1의 buffer</text><text x="273.0" y="140.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">(매핑)</text>
<rect x="40" y="216" width="150" height="44" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="115.0" y="242.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">GPU 0의 memory</text>
<rect x="198" y="216" width="150" height="44" rx="8" fill="#2e5aa8" fill-opacity="0.16" stroke="#2e5aa8" stroke-width="1.25"/><text x="273.0" y="242.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">GPU 1의 memory</text>
<path d="M115 148V214" fill="none" stroke="#66708a" stroke-width="1.4" marker-end="url(#a-muted)"/>
<path d="M273 148V214" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#a-blue)"/>
<text x="283" y="188" text-anchor="start" font-size="12" font-weight="600" xml:space="preserve" fill="#2e5aa8">NVLink</text>
<text x="24" y="292" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">kernel이 주소로 직접 읽고 쓴다. 보내고 받는 단계가 없다.</text>
<text x="24" y="310" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">MNNVL에서는 다른 node의 GPU도 같은 방식으로 매핑된다.</text>
<text x="396" y="60" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#2d3142">InfiniBand</text>
<rect x="396" y="74" width="160" height="92" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="408" y="95" text-anchor="start" font-size="12" font-weight="600" xml:space="preserve" fill="#2d3142">rank 0의 process</text>
<rect x="576" y="74" width="160" height="92" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="588" y="95" text-anchor="start" font-size="12" font-weight="600" xml:space="preserve" fill="#2d3142">rank 8의 process</text>
<rect x="408" y="108" width="136" height="40" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="476.0" y="132.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">내 buffer</text>
<rect x="588" y="108" width="136" height="40" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="656.0" y="132.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">내 buffer</text>
<rect x="408" y="216" width="136" height="44" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="476.0" y="242.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">GPU 0의 memory</text>
<rect x="588" y="216" width="136" height="44" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="656.0" y="242.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">GPU 8의 memory</text>
<path d="M476 148V214" fill="none" stroke="#66708a" stroke-width="1.4" marker-end="url(#a-muted)"/>
<path d="M656 148V214" fill="none" stroke="#66708a" stroke-width="1.4" marker-end="url(#a-muted)"/>
<path d="M546 238H586" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#a-orange)"/>
<text x="566" y="206" text-anchor="middle" font-size="12" font-weight="600" xml:space="preserve" fill="#eb6c36">복사</text>
<text x="396" y="292" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">상대 memory는 내 주소 공간에 나타나지 않는다.</text>
<text x="396" y="310" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">data를 보내고 받아서 옮긴다 (NCCL).</text>
</svg>
