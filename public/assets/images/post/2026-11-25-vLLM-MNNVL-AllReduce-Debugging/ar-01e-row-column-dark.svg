<svg fill="#f5f5f5" xmlns="http://www.w3.org/2000/svg" width="760" height="266" font-family="'Pretendard', system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 266" role="img" aria-label="ColumnParallelLinear와 RowParallelLinear: weight W의 분할 방향" font-size="13">
<rect x="0" y="0" width="760" height="266" fill="#2d3142"/><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3acbf"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6a95d8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f08a59"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-size="15" font-weight="600" xml:space="preserve" fill="#f5f5f5">ColumnParallelLinear와 RowParallelLinear: weight W의 분할 방향</text>
<text x="24" y="62" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#f5f5f5">ColumnParallelLinear: W를 column 방향으로 분할</text>
<text x="52" y="84" text-anchor="middle" font-size="12" xml:space="preserve" fill="#a3acbf">X</text>
<rect x="24" y="92" width="56" height="56" rx="8" fill="none" fill-opacity="1.0" stroke="#5a6180" stroke-width="1.25"/><text x="52.0" y="124.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">X</text>
<text x="94" y="125" text-anchor="middle" font-size="16" xml:space="preserve" fill="#f5f5f5">·</text>
<text x="152" y="84" text-anchor="middle" font-size="12" xml:space="preserve" fill="#a3acbf">W</text>
<rect x="108" y="92" width="44" height="56" rx="8" fill="#6a95d8" fill-opacity="0.16" stroke="#6a95d8" stroke-width="1.25"/><text x="130.0" y="124.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">W0</text>
<rect x="152" y="92" width="44" height="56" rx="8" fill="#f08a59" fill-opacity="0.16" stroke="#f08a59" stroke-width="1.25"/><text x="174.0" y="124.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">W1</text>
<path d="M204 120H234" fill="none" stroke="#a3acbf" stroke-width="1.4" marker-end="url(#a-muted)"/>
<text x="282" y="84" text-anchor="middle" font-size="12" xml:space="preserve" fill="#a3acbf">Y</text>
<rect x="238" y="92" width="44" height="56" rx="8" fill="#6a95d8" fill-opacity="0.16" stroke="#6a95d8" stroke-width="1.25"/><text x="260.0" y="124.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">Y0</text>
<rect x="282" y="92" width="44" height="56" rx="8" fill="#f08a59" fill-opacity="0.16" stroke="#f08a59" stroke-width="1.25"/><text x="304.0" y="124.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">Y1</text>
<text x="24" y="176" text-anchor="start" font-size="12" xml:space="preserve" fill="#a3acbf">W의 column은 출력 차원이다.</text>
<text x="24" y="194" text-anchor="start" font-size="12" xml:space="preserve" fill="#a3acbf">rank마다 Y의 column 일부를 온전하게 얻는다.</text>
<text x="24" y="212" text-anchor="start" font-size="12" xml:space="preserve" fill="#a3acbf">통신이 없다.</text>
<text x="400" y="62" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#f5f5f5">RowParallelLinear: W를 row 방향으로 분할</text>
<text x="444" y="84" text-anchor="middle" font-size="12" xml:space="preserve" fill="#a3acbf">X</text>
<rect x="400" y="92" width="44" height="56" rx="8" fill="#6a95d8" fill-opacity="0.16" stroke="#6a95d8" stroke-width="1.25"/><text x="422.0" y="124.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">X0</text>
<rect x="444" y="92" width="44" height="56" rx="8" fill="#f08a59" fill-opacity="0.16" stroke="#f08a59" stroke-width="1.25"/><text x="466.0" y="124.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">X1</text>
<text x="502" y="125" text-anchor="middle" font-size="16" xml:space="preserve" fill="#f5f5f5">·</text>
<text x="548" y="84" text-anchor="middle" font-size="12" xml:space="preserve" fill="#a3acbf">W</text>
<rect x="516" y="92" width="64" height="28" rx="8" fill="#6a95d8" fill-opacity="0.16" stroke="#6a95d8" stroke-width="1.25"/><text x="548.0" y="110.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">W0</text>
<rect x="516" y="120" width="64" height="28" rx="8" fill="#f08a59" fill-opacity="0.16" stroke="#f08a59" stroke-width="1.25"/><text x="548.0" y="138.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">W1</text>
<path d="M588 120H618" fill="none" stroke="#a3acbf" stroke-width="1.4" marker-end="url(#a-muted)"/>
<text x="683" y="84" text-anchor="middle" font-size="12" xml:space="preserve" fill="#a3acbf">Y의 부분합 둘</text>
<rect x="622" y="92" width="52" height="56" rx="8" fill="#6a95d8" fill-opacity="0.16" stroke="#6a95d8" stroke-width="1.25"/><text x="648.0" y="124.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">X0·W0</text>
<text x="683" y="125" text-anchor="middle" font-size="14" xml:space="preserve" fill="#f5f5f5">+</text>
<rect x="692" y="92" width="52" height="56" rx="8" fill="#f08a59" fill-opacity="0.16" stroke="#f08a59" stroke-width="1.25"/><text x="718.0" y="124.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#f5f5f5">X1·W1</text>
<text x="400" y="176" text-anchor="start" font-size="12" xml:space="preserve" fill="#a3acbf">W의 row는 입력 차원이다. X도 같은 차원으로 나뉘어 온다.</text>
<text x="400" y="194" text-anchor="start" font-size="12" xml:space="preserve" fill="#a3acbf">rank마다 Y와 같은 크기의 부분합을 얻는다.</text>
<text x="400" y="212" text-anchor="start" font-size="12" xml:space="preserve" fill="#a3acbf">all-reduce로 더해야 Y가 된다.</text>
<text x="24" y="246" text-anchor="start" font-size="12" xml:space="preserve" fill="#f5f5f5">Y = XW로 쓰고, W의 shape를 [입력 차원, 출력 차원]으로 본 이름이다.</text>
</svg>
