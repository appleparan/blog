<svg fill="#2d3142" xmlns="http://www.w3.org/2000/svg" width="760" height="420" font-family="'Pretendard', system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 420" role="img" aria-label="sharding된 행렬곱: contracting dimension의 분할과 부분합" font-size="13">
<rect x="0" y="0" width="760" height="420" fill="#efede7"/><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66708a"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e5aa8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6c36"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-size="15" font-weight="600" xml:space="preserve" fill="#2d3142">sharding된 행렬곱: contracting dimension의 분할과 부분합</text>
<text x="24" y="62" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#2d3142">나누기: A[I, J]는 column 방향, B[J, K]는 row 방향</text>
<text x="88" y="82" text-anchor="middle" font-size="12" xml:space="preserve" fill="#66708a">J</text>
<text x="30" y="121" text-anchor="middle" font-size="12" xml:space="preserve" fill="#66708a">I</text>
<rect x="40" y="88" width="48" height="56" rx="8" fill="#2e5aa8" fill-opacity="0.16" stroke="#2e5aa8" stroke-width="1.25"/><text x="64.0" y="120.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">A0</text>
<rect x="88" y="88" width="48" height="56" rx="8" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="1.25"/><text x="112.0" y="120.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">A1</text>
<text x="156" y="121" text-anchor="middle" font-size="16" xml:space="preserve" fill="#2d3142">·</text>
<text x="218" y="82" text-anchor="middle" font-size="12" xml:space="preserve" fill="#66708a">K</text>
<text x="176" y="121" text-anchor="middle" font-size="12" xml:space="preserve" fill="#66708a">J</text>
<rect x="186" y="88" width="64" height="28" rx="8" fill="#2e5aa8" fill-opacity="0.16" stroke="#2e5aa8" stroke-width="1.25"/><text x="218.0" y="106.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">B0</text>
<rect x="186" y="116" width="64" height="28" rx="8" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="1.25"/><text x="218.0" y="134.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">B1</text>
<text x="290" y="104" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">J는 곱하면서 더해 없어지는 차원(contracting dimension)이다.</text>
<text x="290" y="122" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">A와 B를 모두 J 방향으로 반씩 나눠 rank 0과 rank 1에 준다.</text>
<text x="24" y="194" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#2d3142">rank별 계산</text>
<text x="24" y="240" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#2d3142">rank 0</text><rect x="92" y="208" width="48" height="56" rx="8" fill="#2e5aa8" fill-opacity="0.16" stroke="#2e5aa8" stroke-width="1.25"/><text x="116.0" y="240.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">A0</text><text x="156" y="241" text-anchor="middle" font-size="16" xml:space="preserve" fill="#2d3142">·</text><rect x="172" y="222" width="64" height="28" rx="8" fill="#2e5aa8" fill-opacity="0.16" stroke="#2e5aa8" stroke-width="1.25"/><text x="204.0" y="240.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">B0</text><path d="M244 236H278" fill="none" stroke="#66708a" stroke-width="1.4" marker-end="url(#a-muted)"/><rect x="282" y="208" width="64" height="56" rx="8" fill="#2e5aa8" fill-opacity="0.16" stroke="#2e5aa8" stroke-width="1.25"/><text x="314.0" y="240.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">A0·B0</text><text x="356" y="232" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">C와 같은 크기 [I, K]</text><text x="356" y="250" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">J의 절반만 더한 부분합</text><path d="M500 236H534" fill="none" stroke="#66708a" stroke-width="1.4" marker-end="url(#a-muted)"/>
<text x="24" y="320" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#2d3142">rank 1</text><rect x="92" y="288" width="48" height="56" rx="8" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="1.25"/><text x="116.0" y="320.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">A1</text><text x="156" y="321" text-anchor="middle" font-size="16" xml:space="preserve" fill="#2d3142">·</text><rect x="172" y="302" width="64" height="28" rx="8" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="1.25"/><text x="204.0" y="320.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">B1</text><path d="M244 316H278" fill="none" stroke="#66708a" stroke-width="1.4" marker-end="url(#a-muted)"/><rect x="282" y="288" width="64" height="56" rx="8" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="1.25"/><text x="314.0" y="320.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">A1·B1</text><text x="356" y="312" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">C와 같은 크기 [I, K]</text><text x="356" y="330" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">J의 절반만 더한 부분합</text><path d="M500 316H534" fill="none" stroke="#66708a" stroke-width="1.4" marker-end="url(#a-muted)"/>
<rect x="538" y="208" width="90" height="136" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="583.0" y="272.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">all-reduce</text><text x="583.0" y="288.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">(SUM)</text>
<path d="M630 276H660" fill="none" stroke="#66708a" stroke-width="1.4" marker-end="url(#a-muted)"/>
<rect x="664" y="248" width="64" height="56" rx="8" fill="none" fill-opacity="1.0" stroke="#b9bfcc" stroke-width="1.25"/><text x="696.0" y="280.5" text-anchor="middle" font-size="12" xml:space="preserve" fill="#2d3142">C</text>
<text x="696" y="322" text-anchor="middle" font-size="12" xml:space="preserve" fill="#66708a">[I, K]</text>
<text x="24" y="378" text-anchor="start" font-size="13" font-weight="600" xml:space="preserve" fill="#2d3142">C = A0·B0 + A1·B1</text>
<text x="24" y="400" text-anchor="start" font-size="12" xml:space="preserve" fill="#66708a">rank 하나의 결과는 크기만 C와 같다. 둘을 더해야 C가 된다.</text>
</svg>
