<svg fill="#2d3142" xmlns="http://www.w3.org/2000/svg" width="760" height="528" font-family="'Pretendard', system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 528" role="img" aria-label="R1-Zero의 순수 RL로 reasoning을 얻고 4단계로 다듬어 R1이 됐다" font-size="13">
<rect x="0" y="0" width="760" height="528" fill="#f5f5f5"/><defs><marker id="r1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f5d75"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#2d3142">R1-Zero의 순수 RL로 reasoning을 얻고, 4단계로 다듬어 R1이 됐다</text><g fill="none" stroke="#4f5d75" stroke-width="1.25"><path d="M124 104V126" marker-end="url(#r1-arrow)"></path><path d="M124 200V222" marker-end="url(#r1-arrow)"></path><path d="M526 120V142" marker-end="url(#r1-arrow)"></path><path d="M526 200V222" marker-end="url(#r1-arrow)"></path><path d="M526 280V302" marker-end="url(#r1-arrow)"></path><path d="M526 360V382" marker-end="url(#r1-arrow)"></path><path d="M526 424V446" marker-end="url(#r1-arrow)"></path><path d="M224 260H270V92H314" stroke-dasharray="4 4" marker-end="url(#r1-arrow)"></path></g><g><rect x="24" y="64" width="200" height="40" rx="8" fill="none" fill-opacity="1" stroke="#4f5d75" stroke-width="1.25"></rect><text x="124" y="88" text-anchor="middle" font-weight="600" fill="#2d3142">DeepSeek-V3-Base</text></g><g><rect x="24" y="128" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#4f5d75" stroke-width="1.25"></rect><text x="124" y="152" text-anchor="middle" font-weight="600" fill="#2d3142">Pure RL (GRPO)</text><text x="124" y="168" text-anchor="middle" font-size="11.5" fill="#66708a">SFT 없이 바로 시작</text><text x="124" y="184" text-anchor="middle" font-size="11.5" fill="#66708a">reward: 정답 + format</text></g><g><rect x="24" y="224" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#4f5d75" stroke-width="1.25"></rect><text x="124" y="248" text-anchor="middle" font-weight="600" fill="#2d3142">R1-Zero</text><text x="124" y="264" text-anchor="middle" font-size="11.5" fill="#2d3142">AIME 15.6% → 77.9%</text><text x="124" y="280" text-anchor="middle" font-size="11.5" fill="#66708a">가독성 낮음 · 언어 혼합</text></g><g><rect x="316" y="64" width="420" height="56" rx="8" fill="none" fill-opacity="1" stroke="#4f5d75" stroke-width="1.25"></rect><text x="526" y="88" text-anchor="middle" font-weight="600" fill="#2d3142">Cold-start SFT</text><text x="526" y="104" text-anchor="middle" font-size="11.5" fill="#66708a">V3-Base에 R1-Zero 출력을 다듬은 수천 개 long CoT</text></g><g><rect x="316" y="144" width="420" height="56" rx="8" fill="none" fill-opacity="1" stroke="#4f5d75" stroke-width="1.25"></rect><text x="526" y="168" text-anchor="middle" font-weight="600" fill="#2d3142">Reasoning RL</text><text x="526" y="184" text-anchor="middle" font-size="11.5" fill="#66708a">rule reward + language consistency reward</text></g><g><rect x="316" y="224" width="420" height="56" rx="8" fill="none" fill-opacity="1" stroke="#4f5d75" stroke-width="1.25"></rect><text x="526" y="248" text-anchor="middle" font-weight="600" fill="#2d3142">Rejection sampling + SFT</text><text x="526" y="264" text-anchor="middle" font-size="11.5" fill="#66708a">V3-Base에 reasoning 600K + non-reasoning 200K</text></g><g><rect x="316" y="304" width="420" height="56" rx="8" fill="none" fill-opacity="1" stroke="#4f5d75" stroke-width="1.25"></rect><text x="526" y="328" text-anchor="middle" font-weight="600" fill="#2d3142">전 영역 RL</text><text x="526" y="344" text-anchor="middle" font-size="11.5" fill="#66708a">rule reward + helpful·safety RM (preference는 마지막 400 step)</text></g><g><rect x="316" y="384" width="420" height="40" rx="8" fill="#eb6c36" fill-opacity="0.12" stroke="#eb6c36" stroke-width="2"></rect><text x="526" y="408" text-anchor="middle" font-weight="600" fill="#2d3142">DeepSeek-R1</text></g><g><rect x="316" y="448" width="420" height="56" rx="8" fill="none" fill-opacity="1" stroke="#4f5d75" stroke-width="1.25"></rect><text x="526" y="472" text-anchor="middle" font-weight="600" fill="#2d3142">Distillation</text><text x="526" y="488" text-anchor="middle" font-size="11.5" fill="#66708a">800K 데이터로 Qwen · Llama 1.5B–70B를 SFT만</text></g><text x="536" y="136" font-size="11.5" fill="#66708a">Dev1</text><text x="536" y="216" font-size="11.5" fill="#66708a">Dev2</text><text x="536" y="296" font-size="11.5" fill="#66708a">Dev3</text></svg>
