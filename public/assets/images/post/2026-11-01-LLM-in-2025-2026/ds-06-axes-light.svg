0" font-size="12.5" font-weight="600" fill="#2d3142">layer</text><text x="24" y="255" font-size="10.5" fill="#66708a">KV를 가진 layer 수</text><rect x="214" y="226" width="124" height="34" rx="6" fill="none" stroke="#cfd3dc" stroke-dasharray="3 3"></rect><rect x="346" y="226" width="124" height="34" rx="6" fill="none" stroke="#cfd3dc" stroke-dasharray="3 3"></rect><rect x="478" y="226" width="124" height="34" rx="6" fill="none" stroke="#cfd3dc" stroke-dasharray="3 3"></rect><g><rect x="610" y="226" width="124" height="34" rx="6" fill="#eb6c36" fill-opacity="0.85" stroke="#eb6c36" stroke-width="0"></rect><text x="672" y="247" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">CSA2: source 4개</text></g></g><g><text x="24" y="282" font-size="12.5" font-weight="600" fill="#2d3142">정밀도</text><text x="24" y="297" font-size="10.5" fill="#66708a">entry 하나의 bit 수</text><rect x="214" y="268" width="124" height="34" rx="6" fill="none" stroke="#cfd3dc" stroke-dasharray="3 3"></rect><rect x="346" y="268" width="124" height="34" rx="6" fill="none" stroke="#cfd3dc" stroke-dasharray="3 3"></rect><g><rect x="478" y="268" width="124" height="34" rx="6" fill="#eb6c36" fill-opacity="0.85" stroke="#eb6c36" stroke-width="0"></rect><text x="540" y="289" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">FP8</text></g><g><rect x="610" y="268" width="124" height="34" rx="6" fill="#eb6c36" fill-opacity="0.85" stroke="#eb6c36" stroke-width="0"></rect><text x="672" y="289" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">FP4</text></g></g><g><text x="24" y="324" font-size="12.5" font-weight="600" fill="#2d3142">시스템</text><text x="24" y="339" font-size="10.5" fill="#66708a">영구 저장, prefill</text><rect x="214" y="310" width="124" height="34" rx="6" fill="none" stroke="#cfd3dc" stroke-dasharray="3 3"></rect><rect x="346" y="310" width="124" height="34" rx="6" fill="none" stroke="#cfd3dc" stroke-dasharray="3 3"></rect><rect x="478" y="310" width="124" height="34" rx="6" fill="none" stroke="#cfd3dc" stroke-dasharray="3 3"></rect><g><rect x="610" y="310" width="124" height="34" rx="6" fill="#eb6c36" fill-opacity="0.85" stroke="#eb6c36" stroke-width="0"></rect><text x="672" y="331" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">SWA Replay, CED</text></g></g><text x="24" y="370" font-size="11.5" fill="#2d3142">축이 곱으로 쌓인다. token당 global KV는 V4.1-Flash에서 약 890 B로, V1 대비 약 437분의 1이다.</text><text x="24" y="390" font-size="11" fill="#66708a">global KV 수치는 V4.1 논문 Figure 1(b) 기준이다.</text></svg>
