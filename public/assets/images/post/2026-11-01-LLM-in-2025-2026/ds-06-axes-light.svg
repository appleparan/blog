<svg fill="#2d3142" xmlns="http://www.w3.org/2000/svg" width="760" height="400" font-family="'Pretendard', system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 400" role="img" aria-label="DeepSeek 각 세대가 줄인 KV 비용의 축" font-size="13">
<rect x="0" y="0" width="760" height="400" fill="#f5f5f5"/><text x="24" y="32" font-size="15" font-weight="600" fill="#2d3142">각 세대는 KV 비용의 축을 하나씩 더 줄였다</text><text x="24" y="50" font-size="11.5" fill="#66708a">진한 칸은 그 세대가 새로 줄인 축, 옅은 칸은 앞 세대에서 이어받은 축이다.</text><g><text x="276" y="76" text-anchor="middle" font-weight="600" fill="#2d3142">V3</text><text x="276" y="90" text-anchor="middle" font-size="10" fill="#66708a">2024.12</text></g><g><text x="408" y="76" text-anchor="middle" font-weight="600" fill="#2d3142">V3.2</text><text x="408" y="90" text-anchor="middle" font-size="10" fill="#66708a">2025.12</text></g><g><text x="540" y="76" text-anchor="middle" font-weight="600" fill="#2d3142">V4</text><text x="540" y="90" text-anchor="middle" font-size="10" fill="#66708a">2026.04</text></g><g><text x="672" y="76" text-anchor="middle" font-weight="600" fill="#2d3142">V4.1</text><text x="672" y="90" text-anchor="middle" font-size="10" fill="#66708a">2026.09</text></g><g><text x="24" y="114" font-size="12.5" font-weight="600" fill="#2d3142">entry 크기</text><text x="24" y="129" font-size="10.5" fill="#66708a">token당 값 수</text><g><rect x="214" y="100" width="124" height="34" rx="6" fill="#eb6c36" fill-opacity="0.85" stroke="#eb6c36" stroke-width="0"></rect><text x="276" y="121" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">MLA latent</text></g><g><rect x="346" y="100" width="124" height="34" rx="6" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="1"></rect><text x="408" y="121" text-anchor="middle" font-size="11" font-weight="400" fill="#2d3142">이어받음</text></g><g><rect x="478" y="100" width="124" height="34" rx="6" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="1"></rect><text x="540" y="121" text-anchor="middle" font-size="11" font-weight="400" fill="#2d3142">이어받음</text></g><g><rect x="610" y="100" width="124" height="34" rx="6" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="1"></rect><text x="672" y=