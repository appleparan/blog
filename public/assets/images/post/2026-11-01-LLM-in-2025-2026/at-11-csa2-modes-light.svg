<rect x="0" y="0" width="760" height="470" fill="#f5f5f5"/><text x="24" y="32" font-size="15" font-weight="600" fill="#2d3142">Full이 KV를 만들고, Reindex는 다시 고르고, Reuse는 그대로 쓴다</text><text x="24" y="50" font-size="11.5" fill="#66708a">V4.1-Flash decoder layer 20-27. 칸 하나는 cache의 KV entry 하나, 색칠한 칸이 그 layer가 읽는 top-k다(그림은 16개 중 6개).</text><g font-size="11" font-weight="600" fill="#66708a"><text x="24" y="88">layer</text><text x="86" y="88">mode</text><text x="196" y="88">읽는 KV 위치</text><text x="530" y="88">KV 출처</text><text x="640" y="88">선택</text></g><g><text x="24" y="121" font-size="12" fill="#2d3142">layer 20</text><rect x="84" y="107" width="70" height="20" rx="4" fill="#eb6c36" fill-opacity="0.85" stroke="none"></rect><text x="119" y="121" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Full</text><rect x="196" y="107" width="16" height="20" rx="2" fill="none" stroke="#cfd3dc" stroke-width="1"></rect><rect x="215" y="107" width="16" height="20" rx="2" fill="#eb6c36" fill-opacity="0.9" stroke="#eb6c36" stroke-width="1"></rect><rect x="234" y="107" width="16" height="20" rx="2" fill="none" stroke="#cfd3dc" stroke-width="1"></rect><rect x="253" y="107" width="16" height="20" rx="2" fill="none" stroke="#cfd3dc" stroke-width="1"></rect><rect x="272" y="107" width="16" height="20" rx="2" fill="#eb6c36" fill-opacity="0.9" stroke="#eb6c36" stroke-width="1"></rect><rect x="291" y="107" width="16" height="20" rx="2" fill="none" stroke="#cfd3dc" stroke-width="1"></rect><rect x="310" y="107" width="16" height="20" rx="2" fill="#eb6c36" fill-opacity="0.9" stroke="#eb6c36" stroke-width="1"></rect><rect x="329" y="107" width="16" height="20" rx="2" fill="none" stroke="#cfd3dc" stroke-width="1"></rect><rect x="348" y="107" width="16" height="20" rx="2" fill="none" stroke="#cfd3dc" stroke-width="1"></rect><rect x="367" y="107" width="16" height="20" rx="2" fill="#eb6c36" fill-opacity="0.9" stroke="#eb6c36" stroke-width="1"></rect><rect x="386" y="107" width="16