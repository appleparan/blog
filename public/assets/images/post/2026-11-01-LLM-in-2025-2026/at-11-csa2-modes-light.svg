><rect x="443" y="345" width="16" height="20" rx="2" fill="none" stroke="#cfd3dc" stroke-width="1"></rect><rect x="462" y="345" width="16" height="20" rx="2" fill="none" stroke="#cfd3dc" stroke-width="1"></rect><rect x="481" y="345" width="16" height="20" rx="2" fill="#2e5aa8" fill-opacity="0.45" stroke="#2e5aa8" stroke-width="1"></rect><text x="530" y="359" font-size="11" fill="#66708a" font-weight="400">layer 20의 KV</text><text x="640" y="359" font-size="11" fill="#66708a">바로 위 선택 그대로</text></g><path d="M508 117V355" stroke="#eb6c36" stroke-width="1.25" stroke-dasharray="3 3" fill="none"></path><text x="24" y="400" font-size="11.5" fill="#2d3142">Reuse layer는 indexer를 돌리지 않는다. 그래서 layer마다 드는 채점 비용이 Full과 Reindex layer 8개에만 남는다.</text><text x="24" y="422" font-size="11.5" fill="#2d3142">Reindex layer는 같은 KV를 보되 자기 query로 다시 고른다. 그래서 layer 24부터는 다른 위치(파란 칸)를 읽는다.</text><text x="24" y="444" font-size="11" fill="#66708a">모든 layer는 자기 query와 SWA KV는 직접 계산한다. 이 그림은 global KV와 top-k 선택만 보여 준다.</text></svg>
