="11.5" font-weight="600" fill="#2d3142">KDA + MLA</text><text x="568.0416666666667" y="256" text-anchor="middle" font-size="10.5" font-weight="400" fill="#66708a">Kimi Linear</text></g></g><g><circle cx="672.2916666666667" cy="220" r="5" fill="#e4e6ec" stroke="#2a8a7a" stroke-width="2.5"></circle><g><text x="672.2916666666667" y="192" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">KDA + MLA</text><text x="672.2916666666667" y="206" text-anchor="middle" font-size="10.5" font-weight="400" fill="#66708a">Kimi K3</text></g></g><g><circle cx="683.875" cy="220" r="5" fill="#e4e6ec" stroke="#2a8a7a" stroke-width="2.5"></circle><g><text x="683.875" y="242" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">KDA + DSA</text><text x="683.875" y="256" text-anchor="middle" font-size="10.5" font-weight="400" fill="#66708a">GLM-5.3-Flash</text></g></g><text x="24" y="384" font-size="11.5" fill="#66708a">굵은 글씨는 attention 방법, 회색 글씨는 그 방법을 쓴 model이다. DS는 DeepSeek이다.</text></svg>
