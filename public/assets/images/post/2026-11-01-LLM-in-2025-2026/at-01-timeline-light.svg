<svg fill="#2d3142" xmlns="http://www.w3.org/2000/svg" width="760" height="400" font-family="'Pretendard', system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 400" role="img" aria-label="attention 계열의 세 갈래: state로 대체, KV 압축, 둘을 섞은 hybrid" font-size="13">
<rect x="0" y="0" width="760" height="400" fill="#f5f5f5"/><text x="24" y="34" font-size="15" font-weight="600" fill="#2d3142">attention 계열의 세 갈래</text><text x="24" y="54" font-size="11.5" fill="#66708a">KV cache를 고정 크기 state로 바꾸는 갈래와 KV를 압축하고 골라 읽는 갈래가 따로 자라다가, 2025년 하반기부터 섞인다.</text><rect x="597.0000000000001" y="70" width="138.99999999999991" height="290" rx="8" fill="#e4e6ec"></rect><g><line x1="180" x2="180" y1="92" y2="350" stroke="#cfd3dc"></line><text x="249.50000000000003" y="88" text-anchor="middle" font-weight="600" fill="#2d3142">2023</text></g><g><line x1="319" x2="319" y1="92" y2="350" stroke="#cfd3dc"></line><text x="388.5" y="88" text-anchor="middle" font-weight="600" fill="#2d3142">2024</text></g><g><line x1="458" x2="458" y1="92" y2="350" stroke="#cfd3dc"></line><text x="527.5000000000001" y="88" text-anchor="middle" font-weight="600" fill="#2d3142">2025</text></g><g><line x1="597.0000000000001" x2="597.0000000000001" y1="92" y2="350" stroke="#cfd3dc"></line><text x="666.5000000000001" y="88" text-anchor="middle" font-weight="600" fill="#2d3142">2026</text></g><g fill="none" stroke-linecap="round" stroke-width="7" stroke-opacity="0.85"><path d="M313.20833333333337 140H736" stroke="#2e5aa8"></path><path d="M232.125 300H736" stroke="#eb6c36"></path><path d="M486.95833333333337 140C533.2916666666667 140 521.7083333333334 220 556.4583333333334 220" stroke="#2e5aa8" stroke-width="4" stroke-opacity="0.6"></path><path d="M486.95833333333337 300C533.2916666666667 300 521.7083333333334 220 556.4583333333334 220" stroke="#eb6c36" stroke-width="4" stroke-opacity="0.6"></path><path d="M556.4583333333334 220H736" stroke="#2a8a7a"></path></g><g><text x="24" y="126" font-size="12.5" font-weight="600" fill="#2e5aa8">KV cache 대신</text><text x="24" y="142" font-size="12.5" font-weight="600" fill="#2e5aa8">고정 크기 state</text><text x="24" y="159" font-size="11" fill="#66708a">linear attention, SSM</text><text x="24" y="206" font-size="12.5" font-weight="600" fill="#2a8a7a">두 방식을 섞은</text><text x="24" y="222" font-size="12.5" font-weight="600" fill="#2a8a7a">hybrid</text><text x="24" y="239" font-size="11" fill="#66708a">linear 3 : attention 1</text><text x="24" y="286" font-size="12.5" font-weight="600" fill="#eb6c36">KV를 압축하고</text><text x="24" y="302" font-size="12.5" font-weight="600" fill="#eb6c36">골라 읽기</text><text x="24" y="319" font-size="11" fill="#66708a">softmax attention 유지</text></g><g><circle cx="313.20833333333337" cy="140" r="5" fill="#e4e6ec" stroke="#2e5aa8" stroke-width="2.5"></circle><g><text x="313.20833333333337" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">Mamba</text></g></g><g><circle cx="371.125" cy="140" r="5" fill="#e4e6ec" stroke="#2e5aa8" stroke-width="2.5"></circle><g><text x="371.125" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">Mamba2</text></g></g><g><circle cx="452.20833333333337" cy="140" r="5" fill="#e4e6ec" stroke="#2e5aa8" stroke-width="2.5"></circle><g><text x="452.20833333333337" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">GDN</text></g></g><g><circle cx="568.0416666666667" cy="140" r="5" fill="#e4e6ec" stroke="#2e5aa8" stroke-width="2.5"></circle><g><text x="568.0416666666667" y="112" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">KDA</text><text x="568.0416666666667" y="126" text-anchor="middle" font-size="10.5" font-weight="400" fill="#66708a">Kimi Linear</text></g></g><g><circle cx="232.125" cy="300" r="5" fill="#e4e6ec" stroke="#eb6c36" stroke-width="2.5"></circle><g><text x="232.125" y="322" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">GQA</text></g></g><g><circle cx="371.125" cy="300" r="5" fill="#e4e6ec" stroke="#eb6c36" stroke-width="2.5"></circle><g><text x="371.125" y="322" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">MLA</text><text x="371.125" y="336" text-anchor="middle" font-size="10.5" font-weight="