<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"
     role="img" aria-labelledby="vllm-multi-turn-light-title vllm-multi-turn-light-desc">
  <title id="vllm-multi-turn-light-title">How a second chat turn reuses the KV cache of the first</title>
  <desc id="vllm-multi-turn-light-desc">Turn 1 fills blocks 7, 12 and 5 with full 16-token blocks and leaves a partial last block. When turn 1 finishes or is aborted, the full blocks return to the free block queue but keep their hash and their KV values. Turn 2 resends the whole conversation, so its first three blocks have the same hashes and hit the prefix cache. Only the tokens from position 48 on, the end of the answer and the new question, are prefilled again.</desc>
  <defs>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 400; font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'Roboto Mono'; font-weight: 400; font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2'); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <g transform="translate(0,-8)">
  <g>
    <text x="150" y="44" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">TOKENS 0–15</text>
    <text x="262" y="44" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">16–31</text>
    <text x="374" y="44" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">32–47</text>
    <text x="486" y="44" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">48–</text>
    <text x="40" y="65" fill="#2d3142" font-size="11" font-weight="600" font-family="'Pretendard', system-ui, sans-serif">Turn 1</text>
    <text x="40" y="76" fill="#7a8399" font-size="7" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">finished or aborted</text>
    <rect x="150" y="52" width="104" height="28" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="202.0" y="70" fill="#2d3142" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">system + Q1</text>
    <rect x="262" y="52" width="104" height="28" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="314.0" y="70" fill="#2d3142" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">Q1 + A1</text>
    <rect x="374" y="52" width="104" height="28" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="426.0" y="70" fill="#2d3142" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">A1</text>
    <rect x="486" y="52" width="74" height="28" rx="3" fill="none" stroke="rgba(45,49,66,0.35)" stroke-dasharray="3,2" stroke-width="1"/>
    <text x="523.0" y="70" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">A1 end</text>
    <text x="202.0" y="96" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">BLOCK 7 · HASH</text>
    <text x="314.0" y="96" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">BLOCK 12 · HASH</text>
    <text x="426.0" y="96" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">BLOCK 5 · HASH</text>
    <text x="523" y="96" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">NO HASH</text>
    <path d="M202.0 104 V172" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M314.0 104 V172" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M426.0 104 V172" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="208" y="132" width="24" height="12" rx="2" fill="#f5f5f5"/>
    <text x="210" y="141" fill="#eb6c36" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">HIT</text>
    <text x="40" y="187" fill="#2d3142" font-size="11" font-weight="600" font-family="'Pretendard', system-ui, sans-serif">Turn 2</text>
    <text x="40" y="198" fill="#7a8399" font-size="7" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">messages = turn 1 + Q2</text>
    <rect x="150" y="174" width="104" height="28" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="202.0" y="192" fill="#eb6c36" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">same</text>
    <rect x="262" y="174" width="104" height="28" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="314.0" y="192" fill="#eb6c36" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">same</text>
    <rect x="374" y="174" width="104" height="28" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="426.0" y="192" fill="#eb6c36" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">same</text>
    <rect x="486" y="174" width="114" height="28" rx="3" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
    <text x="543.0" y="192" fill="#2d3142" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">A1 end + Q2</text>
    <text x="543" y="220" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PREFILL FROM HERE</text>
    <text x="150" y="244" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">BETWEEN TURNS, THE BLOCKS SIT IN FREE_BLOCK_QUEUE WITH THEIR HASH AND KV</text>
  </g>
  <g>
    <line x1="40" y1="262" x2="600" y2="262" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
    <text x="40" y="278" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Pretendard', system-ui, sans-serif" letter-spacing="0.12em">LEGEND</text>
    <rect x="40" y="292" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="60" y="300" fill="#4f5d75" font-size="8" font-family="'Pretendard', system-ui, sans-serif">Cached full block</text>
    <rect x="168" y="292" width="14" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="188" y="300" fill="#4f5d75" font-size="8" font-family="'Pretendard', system-ui, sans-serif">Partial block</text>
    <rect x="268" y="292" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="288" y="300" fill="#4f5d75" font-size="8" font-family="'Pretendard', system-ui, sans-serif">Reused by prefix cache</text>
    <rect x="432" y="292" width="14" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
    <text x="452" y="300" fill="#4f5d75" font-size="8" font-family="'Pretendard', system-ui, sans-serif">Prefilled again</text>
  </g>
  </g>
</svg>
