<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"
     role="img" aria-labelledby="vllm-kv-block-manager-dark-title vllm-kv-block-manager-dark-desc">
  <title id="vllm-kv-block-manager-dark-title">How KVCacheManager hands out and takes back KV blocks</title>
  <desc id="vllm-kv-block-manager-dark-desc">Free KV blocks wait in free_block_queue, a doubly linked list. allocate_slots pops blocks from the front and records them in req_to_blocks. When a request frees its blocks, blocks without a hash go back to the front for quick reuse, and blocks with a hash go to the tail so that cached blocks are overwritten in LRU order. On a prefix cache hit, cached_block_hash_to_block finds the block and it is taken out of the middle of the queue.</desc>
  <defs>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 400; font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'Roboto Mono'; font-weight: 400; font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2'); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#2d3142"/>
  <g transform="translate(0,-8)">
