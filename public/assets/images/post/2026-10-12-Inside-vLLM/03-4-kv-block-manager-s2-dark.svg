    <text x="544" y="108" fill="#8e98ac" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">TAIL</text>
    <path d="M144 194 V98" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="150" y="172" width="104" height="12" rx="2" fill="#2d3142"/>
    <text x="152" y="181" fill="#8e98ac" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">② FREE · NO HASH</text>
    <rect x="40" y="196" width="248" height="104" rx="6" fill="#2d3142"/>
    <rect x="40" y="196" width="248" height="104" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
    <text x="50" y="211" fill="#bfc0c0" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">req_to_blocks</text>
    <text x="56" y="230" fill="#f5f5f5" font-size="10" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">A → [7, 12]</text>
    <text x="56" y="254" fill="#f5f5f5" font-size="10" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">B → [3]</text>
    <text x="56" y="278" fill="#f5f5f5" font-size="10" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">C → [9, 4, 5]</text>
    <rect x="320" y="196" width="280" height="104" rx="6" fill="#2d3142"/>
    <rect x="320" y="196" width="280" height="104" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
    <text x="330" y="211" fill="#bfc0c0" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">cached_block_hash_to_block</text>
    <text x="336" y="230" fill="#f5f5f5" font-size="10" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">hash(tokens 0–15)  → 8</text>
    <text x="336" y="254" fill="#f5f5f5" font-size="10" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">hash(tokens 0–31)  → 2</text>
    <text x="336" y="278" fill="#8e98ac" font-size="10" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">hash(…) → …</text>
  </g>
  <g>
