    <text x="156" y="358" fill="#bfc0c0" font-size="8" font-family="'Pretendard', system-ui, sans-serif">Free block with hash</text>
    <rect x="288" y="350" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
