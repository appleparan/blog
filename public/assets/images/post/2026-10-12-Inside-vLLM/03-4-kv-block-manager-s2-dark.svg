    <text x="50" y="55" fill="#bfc0c0" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">free_block_queue · doubly linked list</text>
    <line x1="112" y1="83" x2="120" y2="83" stroke="#bfc0c0" stroke-width="1"/>
    <line x1="168" y1="83" x2="176" y2="83" stroke="#bfc0c0" stroke-width="1"/>
    <line x1="224" y1="83" x2="232" y2="83" stroke="#bfc0c0" stroke-width="1"/>
    <line x1="264" y1="83" x2="328" y2="83" stroke="#bfc0c0" stroke-width="1"/>
    <line x1="376" y1="83" x2="384" y2="83" stroke="#bfc0c0" stroke-width="1"/>
    <line x1="432" y1="83" x2="440" y2="83" stroke="#bfc0c0" stroke-width="1"/>
    <line x1="480" y1="83" x2="528" y2="83" stroke="#bfc0c0" stroke-width="1"/>
    <text x="248" y="87" fill="#8e98ac" font-size="10" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">…</text>
    <text x="456" y="87" fill="#8e98ac" font-size="10" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">…</text>
    <rect x="64" y="70" width="48" height="26" rx="3" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
    <text x="88" y="87" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Pretendard', system-ui, sans-serif" text-anchor="middle">5</text>
    <rect x="120" y="70" width="48" height="26" rx="3" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
    <text x="144" y="87" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Pretendard', system-ui, sans-serif" text-anchor="middle">6</text>
    <rect x="176" y="70" width="48" height="26" rx="3" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
