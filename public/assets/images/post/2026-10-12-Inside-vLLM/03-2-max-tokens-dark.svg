<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" width="640" height="298"
     role="img" aria-labelledby="vllm-max-tokens-dark-title vllm-max-tokens-dark-desc">
  <title id="vllm-max-tokens-dark-title">How vLLM caps max_tokens</title>
  <desc id="vllm-max-tokens-dark-desc">max_model_len is the smaller of --max-model-len and the model context length, and holds the prompt and the generated tokens together. The room left after the prompt, max_model_len minus input_length, is the upper bound. With no limit in the request, max_tokens fills that room. A smaller request leaves the rest unused. A larger request is cut at the end of the context window.</desc>
  <defs>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 400; font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'Roboto Mono'; font-weight: 400; font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2'); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#2d3142"/>
  <g transform="translate(0,-8)">
  <g>
    <path d="M200 46 V40 H560 V46" fill="none" stroke="#8e98ac" stroke-width="0.8"/>
    <text x="380.0" y="34" fill="#8e98ac" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">MAX_MODEL_LEN = MIN(--MAX-MODEL-LEN, CONTEXT LENGTH)</text>
    <path d="M200 76 V70 H320 V76" fill="none" stroke="#8e98ac" stroke-width="0.8"/>
    <text x="260.0" y="64" fill="#8e98ac" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">INPUT_LENGTH</text>
    <path d="M320 76 V70 H560 V76" fill="none" stroke="#f08a59" stroke-width="0.8"/>
    <text x="440.0" y="64" fill="#f08a59" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">MAX_MODEL_LEN − INPUT_LENGTH</text>
    <line x1="560" y1="76" x2="560" y2="200" stroke="#8e98ac" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="40" y="95" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Pretendard', system-ui, sans-serif">No limit in request</text>
    <text x="40" y="107" fill="#bfc0c0" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">max_tokens = None</text>
    <rect x="200" y="88" width="120" height="18" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
    <text x="260.0" y="100" fill="#bfc0c0" font-size="7" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">PROMPT</text>
    <rect x="320" y="88" width="240" height="18" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
    <text x="440.0" y="100" fill="#f08a59" font-size="7" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">MAX_TOKENS</text>
    <text x="40" y="135" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Pretendard', system-ui, sans-serif">Smaller request</text>
    <text x="40" y="147" fill="#bfc0c0" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">max_tokens = 128</text>
    <rect x="200" y="128" width="120" height="18" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
    <text x="260.0" y="140" fill="#bfc0c0" font-size="7" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">PROMPT</text>
    <rect x="320" y="128" width="100" height="18" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
    <text x="370.0" y="140" fill="#f08a59" font-size="7" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">MAX_TOKENS</text>
    <rect x="420" y="128" width="140" height="18" fill="transparent" stroke="rgba(245,245,245,0.35)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="490.0" y="140" fill="#bfc0c0" font-size="7" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">NOT GENERATED</text>
    <text x="40" y="175" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Pretendard', system-ui, sans-serif">Larger request</text>
    <text x="40" y="187" fill="#bfc0c0" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">max_tokens = 100000</text>
    <rect x="200" y="168" width="120" height="18" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
    <text x="260.0" y="180" fill="#bfc0c0" font-size="7" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">PROMPT</text>
    <rect x="320" y="168" width="240" height="18" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
    <text x="440.0" y="180" fill="#f08a59" font-size="7" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">MAX_TOKENS</text>
    <rect x="560" y="168" width="56" height="18" fill="transparent" stroke="rgba(245,245,245,0.35)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="588.0" y="180" fill="#bfc0c0" font-size="7" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">CUT</text>
    <text x="40" y="222" fill="#f08a59" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">MAX_TOKENS = MIN(MAX_MODEL_LEN − INPUT_LENGTH, FALLBACK_MAX_TOKENS, …)</text>
  </g>
  <g>
    <line x1="40" y1="240" x2="600" y2="240" stroke="rgba(245,245,245,0.1)" stroke-width="0.8"/>
    <text x="40" y="256" fill="#bfc0c0" font-size="8" font-weight="600" font-family="'Pretendard', system-ui, sans-serif" letter-spacing="0.12em">LEGEND</text>
    <rect x="40" y="270" width="14" height="10" rx="2" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
    <text x="60" y="278" fill="#bfc0c0" font-size="8" font-family="'Pretendard', system-ui, sans-serif">Prompt tokens</text>
    <rect x="140" y="270" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
    <text x="160" y="278" fill="#bfc0c0" font-size="8" font-family="'Pretendard', system-ui, sans-serif">Allowed new tokens</text>
    <rect x="268" y="270" width="14" height="10" rx="2" fill="transparent" stroke="rgba(245,245,245,0.35)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="288" y="278" fill="#bfc0c0" font-size="8" font-family="'Pretendard', system-ui, sans-serif">Not generated</text>
    <text x="40" y="292" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Pretendard', system-ui, sans-serif">Name</text>
    <text x="68" y="292" fill="#bfc0c0" font-size="8" font-family="'Pretendard', system-ui, sans-serif">Role of the step</text>
    <text x="160" y="292" fill="#bfc0c0" font-size="9" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace">code()</text>
    <text x="198" y="292" fill="#bfc0c0" font-size="8" font-family="'Pretendard', system-ui, sans-serif">Code identifier, () marks a function</text>
  </g>
  </g>
</svg>
