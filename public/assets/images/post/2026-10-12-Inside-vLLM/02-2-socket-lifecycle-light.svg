    <text x="204.0" y="126.0" fill="#4f5d75" font-size="9" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle">bind()</text>
    <rect x="272" y="92" width="96" height="44" rx="6" fill="#f5f5f5"/>
    <rect x="272" y="92" width="96" height="44" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="320.0" y="112.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', system-ui, sans-serif" text-anchor="middle">Engine init</text>
