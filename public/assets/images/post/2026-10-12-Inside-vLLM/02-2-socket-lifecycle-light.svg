<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260"
     role="img" aria-labelledby="vllm-socket-lifecycle-light-title vllm-socket-lifecycle-light-desc">
  <title id="vllm-socket-lifecycle-light-title">Server socket lifecycle in vLLM: bind early, listen late</title>
  <desc id="vllm-socket-lifecycle-light-desc">setup_server creates the socket and binds the port. The engine is then built in subsections 3 to 5 while the port stays held but nothing listens, so a client connect is refused. Uvicorn calls listen at startup, and accept runs for each connection after that.</desc>
