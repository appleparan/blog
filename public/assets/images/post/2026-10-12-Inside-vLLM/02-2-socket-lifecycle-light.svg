    <text x="320" y="192" fill="#eb6c36" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PORT HELD · CONNECT() IS REFUSED</text>
    <text x="518" y="192" fill="#7a8399" font-size="8" font-family="'Roboto Mono', 'Pretendard', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ACCEPTING REQUESTS</text>
